<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目导航</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f2; color: #171717; }
    main { width: min(1040px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0; }
    h1 { margin: 0 0 12px; font-size: clamp(36px, 6vw, 64px); letter-spacing: -0.05em; }
    .intro { margin: 0 0 48px; color: #666; }
    .list { display: grid; gap: 12px; }
    a { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 22px 24px; border: 1px solid #ddd; border-radius: 16px; background: #fff; color: inherit; text-decoration: none; transition: transform .18s ease, border-color .18s ease; }
    a:hover { transform: translateY(-2px); border-color: #777; }
    .number { color: #888; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    strong { display: block; margin-bottom: 5px; font-size: 19px; }
    .description { color: #777; line-height: 1.5; }
    .open { color: #333; font-weight: 700; white-space: nowrap; }
    @media (max-width: 640px) {
      main { padding: 48px 0; }
      a { grid-template-columns: 1fr auto; }
      .number { grid-column: 1 / -1; }
      .description { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>项目导航</h1>
    <p class="intro">所有已发布的 HTML 项目都集中在这里。</p>
    <section class="list" aria-label="项目列表">
      <a href="./project-01/">
        <span class="number">PROJECT 01</span>
        <span>
          <strong>儿力力全国快闪衍生品开发策略</strong>
          <span class="description">自由拖拽、缩放、可编辑版本</span>
        </span>
        <span class="open">进入项目 →</span>
      </a>
    </section>
  </main>
</body>
</html>
